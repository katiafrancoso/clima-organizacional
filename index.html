<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Análise de Clima Organizacional — DCA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b12;--surface:#0f1320;--card:#141928;--card2:#1a2035;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.14);
  --text:#e4eaf6;--muted:#7a869e;
  --accent:#4f8ef7;--accent2:#7c5cfc;
  --verde:#22c55e;--amarelo:#f59e0b;--vermelho:#ef4444;
  --verde-bg:rgba(34,197,94,0.1);--amarelo-bg:rgba(245,158,11,0.1);--vermelho-bg:rgba(239,68,68,0.1);
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 50% at 15% 15%,rgba(79,142,247,0.07) 0%,transparent 60%),
             radial-gradient(ellipse 55% 45% at 85% 85%,rgba(124,92,252,0.06) 0%,transparent 60%)}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* HEADER */
header{border-bottom:1px solid var(--border);padding:17px 32px;display:flex;align-items:center;gap:12px;
  backdrop-filter:blur(12px);background:rgba(8,11,18,0.88);position:sticky;top:0;z-index:100}
.logo{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
header h1{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.2px}
.header-sub{color:var(--muted);font-size:12px;margin-left:auto}

/* MAIN */
main{flex:1;padding:0 16px}
.wrap{max-width:720px;margin:0 auto}
